name: Deploy to GitHub Pages

# Retired. This was a second home for when *.vercel.app was blocked on the
# network the app is used from; that block has lifted, and running two copies
# of a programme that tracks your progress means two sets of progress.
#
# The URL still answers, because bookmarks and an installed PWA point at it.
# It serves a notice that hands back whatever is in this origin's localStorage
# — the static export never synced to the server, so nothing here is on the
# server either — and then sends you to Vercel.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-retired

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
